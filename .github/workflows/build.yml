name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    # Vacio si el job no llega a arrancar: distingue build de empaquetado.
    outputs:
      build_step: ${{ steps.build.outcome }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wipe Unused Xcode Versions & Free Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /usr/local/share/android-sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/com.apple.dt.Xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 2>&1 | tee build.log || (echo "=== DETALLE DE ERRORES ===" && grep -i "error:" build.log && exit 1)

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R /tmp/DerivedData/Build/Products/Release-iphoneos/AppGym.app Payload/
          zip -r AppGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGym-Unsigned-IPA
          path: AppGym.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  # Job barato en Linux: arranca aunque el de macOS no llegue a empezar, asi que
  # distingue "el run no corre" de "el token no puede escribir".
  report:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download build log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Publish status
        continue-on-error: true
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_STEP: ${{ needs.build.outputs.build_step }}
          CI_STATUS_TOKEN: ${{ secrets.CI_STATUS_TOKEN }}
        run: |
          set +e
          status_file="$RUNNER_TEMP/ci-status.txt"
          date_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "result=$BUILD_RESULT"
            echo "build=$BUILD_STEP"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "date=$date_utc"
          } > "$status_file"

          errors=""
          if [ "$BUILD_RESULT" != "success" ]; then
            if [ -f build.log ]; then
              errors="$(grep -i "error:" build.log | head -200)"
              if [ -z "$errors" ]; then
                errors="$(tail -100 build.log)"
              fi
            else
              errors="Sin build.log: el job de macOS no llego a ejecutar ni el checkout (minutos macOS del plan, Actions deshabilitado o limite de gasto)."
            fi
          fi

          {
            echo "## CI status"
            echo ""
            echo "| campo | valor |"
            echo "| --- | --- |"
            echo "| job | \`$BUILD_RESULT\` |"
            echo "| paso build | \`$BUILD_STEP\` |"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| run | \`$GITHUB_RUN_ID\` |"
            echo "| fecha | $date_utc |"
            echo ""
            if [ -n "$errors" ]; then
              echo '```'
              echo "$errors"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si el token por defecto es de solo lectura, un PAT con contents:write
          # en el secreto CI_STATUS_TOKEN publica la rama igualmente.
          if [ -n "$CI_STATUS_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${CI_STATUS_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          commit=""
          blob="$(git hash-object -w "$status_file")"
          if [ -n "$blob" ]; then
            tree="$(printf '100644 blob %s\tci-status.txt\n' "$blob" | git mktree)"
            if [ -n "$tree" ]; then
              commit="$(git commit-tree "$tree" -m "CI status: $BUILD_RESULT [skip ci]")"
            fi
          fi

          if [ -n "$commit" ]; then
            git push -f origin "$commit:refs/heads/ci-status" \
              || echo "No se pudo publicar ci-status: el estado queda en el resumen del run."
          else
            echo "No se pudo crear el commit de estado."
          fi

          exit 0
