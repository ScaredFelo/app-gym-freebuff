name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wipe Unused Xcode Versions & Free Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /usr/local/share/android-sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/com.apple.dt.Xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        id: build
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 2>&1 | tee build.log || (echo "=== DETALLE DE ERRORES ===" && grep -i "error:" build.log && exit 1)

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R /tmp/DerivedData/Build/Products/Release-iphoneos/AppGym.app Payload/
          zip -r AppGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGym-Unsigned-IPA
          path: AppGym.ipa

      - name: Publish CI status branch
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set +e

          # Fuera del repo: no deja archivos sin seguimiento en el workspace.
          work_file="$RUNNER_TEMP/ci-status.txt"

          {
            echo "result=$JOB_STATUS"
            echo "build=$BUILD_OUTCOME"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$work_file"

          add_errors() {
            echo "" >> "$work_file"
            echo "--- errors ---" >> "$work_file"
          }

          case "$BUILD_OUTCOME" in
            failure)
              add_errors
              if [ -f build.log ]; then
                errors="$(grep -i "error:" build.log | head -200)"
                if [ -n "$errors" ]; then
                  echo "$errors" >> "$work_file"
                else
                  echo "Sin lineas 'error:' en build.log. Ultimas 150 lineas:" >> "$work_file"
                  tail -150 build.log >> "$work_file"
                fi
              else
                echo "El paso de build fallo sin generar build.log." >> "$work_file"
              fi
              ;;
            skipped|cancelled)
              add_errors
              echo "El build no llego a ejecutarse (build=$BUILD_OUTCOME, job=$JOB_STATUS): el fallo o la cancelacion fue anterior al paso de compilacion." >> "$work_file"
              ;;
            *)
              if [ "$JOB_STATUS" = "cancelled" ]; then
                add_errors
                echo "Job cancelado con el build en estado $BUILD_OUTCOME." >> "$work_file"
              elif [ "$JOB_STATUS" != "success" ]; then
                add_errors
                echo "El build compilo (build=$BUILD_OUTCOME) pero el job termino en $JOB_STATUS: el fallo esta fuera de la compilacion (empaquetado o subida del artefacto)." >> "$work_file"
              fi
              ;;
          esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit=""
          blob="$(git hash-object -w "$work_file")"
          if [ -n "$blob" ]; then
            tree="$(printf '100644 blob %s\tci-status.txt\n' "$blob" | git mktree)"
            if [ -n "$tree" ]; then
              commit="$(git commit-tree "$tree" -m "CI status: $JOB_STATUS [skip ci]")"
            fi
          fi

          if [ -n "$commit" ]; then
            git push -f origin "$commit:refs/heads/ci-status" \
              || echo "No se pudo publicar la rama ci-status (revisa los permisos del token)."
          else
            echo "No se pudo crear el commit de estado; no se publica nada."
          fi

          # El diagnostico nunca debe convertir un run en rojo.
          exit 0
