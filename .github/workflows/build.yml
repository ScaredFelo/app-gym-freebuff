name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Wipe Unused Xcode Versions & Free Disk Space
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Applications/Xcode_14*.app
          sudo rm -rf /usr/local/share/android-sdk
          sudo rm -rf /usr/local/share/dotnet
          sudo rm -rf /Library/Developer/CoreSimulator/Caches
          rm -rf ~/Library/Caches/com.apple.dt.XCode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild build \
            -project AppGym.xcodeproj \
            -scheme AppGym \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 2>&1 | tee build.log || (echo "=== DETALLE DE ERRORES ===" && grep -i "error:" build.log && exit 1)

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R /tmp/DerivedData/Build/Products/Release-iphoneos/AppGym.app Payload/
          zip -r AppGym.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppGym-Unsigned-IPA
          path: AppGym.ipa

      - name: Publish CI status branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          status_file="ci-status.txt"

          {
            echo "result=$JOB_STATUS"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$status_file"

          if [ "$JOB_STATUS" != "success" ]; then
            echo "" >> "$status_file"
            echo "--- errors ---" >> "$status_file"
            if [ -f build.log ]; then
              errors="$(grep -i "error:" build.log | head -200)"
              if [ -n "$errors" ]; then
                echo "$errors" >> "$status_file"
              else
                echo "Sin lineas 'error:' en build.log. Ultimas 150 lineas:" >> "$status_file"
                tail -150 build.log >> "$status_file"
              fi
            else
              echo "build.log no existe: el fallo ocurrio antes del paso de compilacion." >> "$status_file"
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          blob=$(git hash-object -w "$status_file")
          tree=$(printf '100644 blob %s\t%s\n' "$blob" "$status_file" | git mktree)
          commit=$(git commit-tree "$tree" -m "CI status: $JOB_STATUS [skip ci]")

          git push -f origin "$commit:refs/heads/ci-status" \
            || echo "No se pudo publicar la rama ci-status (comprueba los permisos del token)."
