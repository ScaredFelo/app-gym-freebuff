name: AppGym
options:
  bundleIdPrefix: com.jordiferres
  objectVersion: 56

fileGroups:
  - AppGym/AppGym.entitlements

targets:
  AppGym:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.jordiferres.appgym
    entitlements:
      path: AppGym/AppGym.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.appgym.shared
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: App.swift
      - path: Assets.xcassets
      - path: Attributes
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Theme
    dependencies:
      - target: AppGymWidgets
    frameworks:
      - sdk: HealthKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: ActivityKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AppGym
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Modos que la app usa de verdad: audio (campana de descanso y avisos
        # con la pantalla bloqueada) y bluetooth-central (banda de pulso BLE
        # durante la sesion).
        #
        # `workout-processing`: Apple lo documenta SOLO para watchOS, asi que en
        # iOS no se aplica. No hay evidencia de fallo (el build compila y no hay
        # ruta de codigo que dependa de el), y la ruta de HKWorkoutSession de
        # iOS 26 se apoya en el entitlement de HealthKit, no en este modo. Se
        # mantiene tal cual hasta revisarlo con un dispositivo y el perfil de
        # aprovisionamiento reales; quitarlo no aporta nada hoy y no se puede
        # validar aqui.
        #
        # `processing` se retiro: no hay BGTaskScheduler ni BGProcessingTask en
        # el proyecto, y declarar modos en segundo plano sin uso es un motivo
        # habitual de rechazo (guia 2.5.4).
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - workout-processing
        NSBluetoothAlwaysUsageDescription: "AppGym requiere acceso a Bluetooth para conectar con el sensor de pulso cardíaco."
        NSBluetoothPeripheralUsageDescription: "AppGym requiere acceso a Bluetooth para conectar con el sensor de pulso cardíaco."
        NSHealthShareUsageDescription: "Necesitamos acceder a tus pulsaciones para mostrar tu frecuencia cardíaca en el temporizador."
        NSHealthUpdateUsageDescription: "Necesitamos registrar tus sesiones de entrenamiento en Apple Health."
    settings:
      base:
        PRODUCT_NAME: AppGym
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiferres.appgym
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: "minimal"
        GENERATE_INFOPLIST_FILE: "NO"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: AppGym/AppGym.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: AppGym/AppGym.entitlements

  AppGymWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.jordiferres.appgym.widgets
    entitlements:
      path: Widgets/AppGymWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.appgym.shared
    sources:
      - path: Widgets
      - path: Attributes/WorkoutActivityAttributes.swift
      - path: Theme
      - path: Services/WidgetStreakStore.swift
    frameworks:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: AppGym
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: AppGymWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.jordiferres.appgym.widgets
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: "minimal"
        GENERATE_INFOPLIST_FILE: "NO"

# El esquema se declara aqui para que `xcodegen generate` lo regenere siempre.
# Sin esta seccion, CI usa el .xcscheme versionado como residuo y cualquier
# cambio de configuracion del esquema se queda fuera del build.
schemes:
  AppGym:
    build:
      targets:
        AppGym: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

